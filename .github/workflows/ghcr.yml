name: Build and publish a Docker image to ghcr.io
on:
  release:
    types: [published]

jobs:
  docker_publish:
    runs-on: 'ubuntu-22.04'
    permissions:
      contents: read
      packages: write
    # Read by the shell inside the action, never pasted into its script, so a
    # tag name cannot inject commands.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # https://github.com/marketplace/actions/push-to-ghcr
      - name: Build and publish a Docker image for ${{ github.repository }}
        uses: macbre/push-to-ghcr@de5b1f400829a79007e48b901ef7e92a82b6486e # v18
        with:
          image_name: ${{ github.repository }} # it will be lowercased internally
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The release the admin UI compares against the latest one.
          extra_args: >-
            --build-arg MASUMI_RELEASE_VERSION=$RELEASE_TAG
            --build-arg MASUMI_RELEASE_COMMIT=$RELEASE_COMMIT

  # The Hydra Host ships under the same release tag as the payment service, so
  # one version names the whole stack. amd64 only: the Host deploy guide requires
  # an amd64 machine.
  hydra_host_publish:
    runs-on: 'ubuntu-22.04'
    # Configure required reviewers and restrict release tags in Settings before
    # the first release. A workflow file cannot create those repository rules.
    environment: hydra-host-release
    permissions:
      contents: write # Upload the signed digest manifest to this release.
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify the release source
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo 'Release tag must be a project version' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
            echo 'The release tag does not resolve to the release commit' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo 'The release commit must be merged into main' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish the Hydra Host image with provenance and SBOM
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYDRA_HOST_IMAGE_SIGNING_KEY_PEM: ${{ secrets.HYDRA_HOST_IMAGE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          for binary in docker gh jq openssl; do
            command -v "$binary" >/dev/null || { echo "Missing release tool: $binary" >&2; exit 1; }
          done
          if [[ -z "$HYDRA_HOST_IMAGE_SIGNING_KEY_PEM" ]]; then
            echo 'The protected release environment has no Hydra Host image signing key' >&2
            exit 1
          fi
          umask 077
          signing_key="$(mktemp "$RUNNER_TEMP/hydra-host-signing.XXXXXX")"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$HYDRA_HOST_IMAGE_SIGNING_KEY_PEM" > "$signing_key"
          openssl pkey -in "$signing_key" -noout

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}-hydra-host"
          docker buildx build \
            --file packages/hydra-host/Dockerfile \
            --platform linux/amd64 \
            --tag "$image:$RELEASE_TAG" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --build-arg "MASUMI_RELEASE_VERSION=$RELEASE_TAG" \
            --build-arg "MASUMI_RELEASE_COMMIT=$RELEASE_COMMIT" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$RUNNER_TEMP/hydra-host-build.json" \
            --push .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/hydra-host-build.json")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Buildx did not report a valid image digest' >&2
            exit 1
          fi
          manifest="$RUNNER_TEMP/hydra-host-image.txt"
          signature="$manifest.sig"
          printf 'image=%s\ndigest=%s\nrelease=%s\ncommit=%s\n' \
            "$image" "$digest" "$RELEASE_TAG" "$RELEASE_COMMIT" > "$manifest"
          openssl dgst -sha256 -sign "$signing_key" -out "$signature" "$manifest"
          gh release upload "$RELEASE_TAG" "$manifest" "$signature" --repo "$GITHUB_REPOSITORY"
          printf 'Hydra Host image: %s@%s\nSigned manifest: %s\n' \
            "$image" "$digest" "hydra-host-image.txt" >> "$GITHUB_STEP_SUMMARY"
