# Explicit peer-plane exposure for the compose rig. Use only behind a verified
# peer ruleset on the Docker host, applied by
# packages/hydra-host/scripts/hydra-peer-firewall (see
# docs/hydra-host-deploy-droplet.md for install and settings).
#
# Start/reload sequence:
#   1. `sudo hydra-peer-firewall baseline` refuses the whole peer range.
#   2. Start with the acknowledgement taken from the verifier, so compose
#      refuses to start unless the loaded ruleset was just verified:
#        HYDRA_HOST_PEER_FIREWALL_ACK="$(sudo hydra-peer-firewall verify)" \
#          docker compose -f docker-compose.yml -f docker-compose.public-peer.yml up -d
#   3. `sudo hydra-peer-firewall refresh` opens each peered port. Run it on the
#      hydra-peer-firewall.timer, and again after every provision, invite
#      redemption, node removal or DNS change.
#
# This file, and the acknowledgement it requires, exist only for compose.
# HYDRA_HOST_PEER_FIREWALL_ACK is read by nothing in the Host. A systemd unit
# gets the same gate from `ExecStartPre=hydra-peer-firewall baseline`; native
# mode and a plain `docker run` get it only if the operator runs the script.

services:
  hydra-host:
    environment:
      # Required acknowledgement. `hydra-peer-firewall verify` prints a value
      # only when the loaded ruleset refuses the peer range on both hooks, so an
      # empty value means the firewall is not verified.
      HYDRA_HOST_PEER_FIREWALL_ACK: ${HYDRA_HOST_PEER_FIREWALL_ACK:?set it from hydra-peer-firewall verify}
    ports:
      # Must match HYDRA_HOST_PEER_PORT_START and _COUNT in the base file.
      - '${HYDRA_HOST_PEER_BIND_IP:-0.0.0.0}:5001-5032:5001-5032'
