# Explicit peer-plane exposure. Use only after applying the complete ruleset
# returned by authenticated GET /v1/peer-allowlist on the Docker host.
#
# Start/reload sequence:
#   1. Save the `nftables` response field to a root-owned file.
#   2. Run `nft -c -f FILE`, then `nft -f FILE`.
#   3. Set HYDRA_HOST_PEER_FIREWALL_ACK and start with this override.
#   4. Repeat steps 1-2 whenever peer membership or DNS changes.

services:
  hydra-host:
    environment:
      # Required acknowledgement. The value is not a secret; its purpose is to
      # make unauthenticated exposure an explicit deployment choice.
      HYDRA_HOST_PEER_FIREWALL_ACK: ${HYDRA_HOST_PEER_FIREWALL_ACK:?apply the peer nftables rules first}
    ports:
      # Must match HYDRA_HOST_PEER_PORT_START and _COUNT in the base file.
      - '${HYDRA_HOST_PEER_BIND_IP:-0.0.0.0}:5001-5032:5001-5032'
