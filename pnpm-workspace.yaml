packages:
  - frontend
  - packages/*

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - chacha-native
  - core-js
  - esbuild
  - unrs-resolver

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - protobufjs
  - sharp

overrides:
  # Cardano serialization libs need this exact libsodium build.
  libsodium-sumo: 0.7.15
  libsodium-wrappers-sumo: 0.7.15
  # Hold the transitive react-hooks lint plugin at the version main uses; 7.1.x
  # enables stricter React-Compiler rules that flag pre-existing valid code.
  eslint-plugin-react-hooks: 7.0.1
  # Every Zod copy must be 4.6.6 so patches/zod@4.6.6.patch applies to it.
  # Upstream 4.6.7 does not carry the fix yet.
  zod@>=4 <5: 4.6.6
  '@x402/core>zod': 4.6.6
  '@x402/evm>zod': 4.6.6
  '@x402/extensions>zod': 4.6.6
  'masumi-schema-validator-component>zod': 4.6.6
  # postman-collection 5.3.1 still pins faker 5.5.3 and uuid 8.3.2.
  # patches/postman-collection@5.3.1.patch maps its Faker 5 names to Faker 10.
  postman-collection>@faker-js/faker: 10.5.0
  postman-collection>uuid: 11.1.1
  # Parents below pin a vulnerable version even at their latest release.
  # Mesh SDK (V1 and V2 lines are frozen) pulls @cardano-sdk/core, which
  # asks for ip-address 9, and @utxorpc/sdk, whose @connectrpc/connect-node
  # asks for undici 5.
  ip-address: 10.7.4
  undici: 6.29.1
  # openapi-to-postmanv2 6.4.3 pins yaml 1.10.2 and js-yaml 4.3.0.
  # @hey-api/json-schema-ref-parser pins js-yaml 4.2.0. The js-yaml pin is not
  # scoped, so @istanbuljs/load-nyc-config also gets 4.x (it calls only load()).
  yaml@>=1 <2: 1.10.3
  js-yaml: 4.3.2
  # monaco-editor 0.57.0 pins dompurify 3.4.15.
  dompurify: 3.4.17
  # glob GHSA-3g3m-2fjr-6pw4 is fixed only in 14.0.2. jest 30.5 asks for glob 13
  # and test-exclude 7 for glob 10. Both call only glob.sync / glob(), which
  # glob 14 keeps.
  '@jest/reporters>glob': 14.0.4
  jest-config>glob: 14.0.4
  jest-runtime>glob: 14.0.4
  test-exclude>glob: 14.0.4
  '@blockfrost/openapi>rimraf': 6.1.4
  # gaxios 7.3.1 drops rimraf. gcp-metadata 8 pins gaxios 7.1.3, and the OTel GCP
  # detector (2.x and 3.x lines) still asks for gcp-metadata 8.
  gcp-metadata>gaxios: 7.3.1
  # minimatch GHSA-g3hv-75wg-m249 is fixed only in 11.0.1. test-exclude 7 still
  # asks for 10 and calls only minimatch(path, pattern), which 11 keeps.
  test-exclude>minimatch: 11.0.7

patchedDependencies:
  '@sundaeswap/core': patches/@sundaeswap__core.patch
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
  masumi-schema-validator-component@1.2.0: patches/masumi-schema-validator-component@1.2.0.patch
  postman-collection@5.3.1: patches/postman-collection@5.3.1.patch
  zod@4.6.6: patches/zod@4.6.6.patch
